# Nginx configuration for serving donttrustverify.pt
# Reference for anyone wanting to reproduce the verification page locally
# or in their own infrastructure.
#
# This snippet is included from the main server block in
# /etc/nginx/sites-available/donttrustverify.pt
#
# Place this file at /etc/nginx/snippets/verify.conf and include it
# inside the HTTPS server block, after the main `location /` directive:
#
#   include /etc/nginx/snippets/verify.conf;
#
# The routing for /verify/, /verify/pt/, /verify/en/ works automatically
# via the pre-existing `try_files $uri $uri/` directive.

location /static/ {
    types {
        text/css           css;
        text/plain         txt;
        application/octet-stream  ots;
    }
    default_type application/octet-stream;

    add_header Cache-Control "public, max-age=3600";

    # Serve .ots files as binary downloads with a long cache window.
    # The .ots is an immutable cryptographic artefact — it never changes
    # for a given hash, so aggressive caching is safe and correct.
    location ~ \.ots$ {
        add_header Content-Disposition "attachment";
        add_header Content-Type "application/octet-stream";
        add_header Cache-Control "public, max-age=86400";
    }
}

# Notes:
# - Zero JavaScript on the served pages by design.
# - Zero analytics, zero cookies, zero external dependencies.
# - SSL via Let's Encrypt with certbot systemd timer for auto-renewal.
# - Files served directly from /var/www/donttrustverify.pt/html/,
#   mirroring the structure of the `site/` directory in this repository.
